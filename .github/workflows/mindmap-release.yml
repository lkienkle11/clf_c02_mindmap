# Builds, signs and publishes the production channel when a v* tag is pushed.
# See easy_mindmap_knowledge/docs/RELEASING.md.
name: mindmap-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mindmap-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: easy_mindmap_knowledge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easy_mindmap_knowledge/package-lock.json

      # The tests and the type check run once here; the platform builds below do not repeat them.
      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: Check the release
        run: node scripts/release/check-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # One job creates the draft release, so the parallel builds below upload into it and never create a second one.
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Reuse a draft of this tag (a re-run); otherwise create it and take the id from the creation response,
          # because the releases list lags a moment behind a creation.
          id=$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="AWS CLF-C02 Mindmap $TAG" -f body="Release in progress." -F draft=true --jq .id)
          fi
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            bundles: nsis
            args: ''
            rust_targets: ''
          - os: ubuntu-latest
            bundles: deb
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: easy_mindmap_knowledge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easy_mindmap_knowledge/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: easy_mindmap_knowledge/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_CHANNEL: production
          VITE_APP_CHANNEL: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: easy_mindmap_knowledge
          releaseId: ${{ needs.draft.outputs.release_id }}
          # latest.json is built once in finalize from the uploaded files, so parallel jobs never overwrite each other.
          uploadUpdaterJson: false
          args: --config src-tauri/tauri.production.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.args }}

  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build latest.json, add notes and publish
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq .assets > assets.json
          mkdir sigs
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
          node easy_mindmap_knowledge/scripts/release/build-latest.mjs assets.json sigs "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" latest.json
          node easy_mindmap_knowledge/scripts/release/assert-platforms.mjs latest.json
          node easy_mindmap_knowledge/scripts/release/add-sizes.mjs latest.json assets.json
          node easy_mindmap_knowledge/scripts/release/changelog.mjs "${GITHUB_REF_NAME#v}" easy_mindmap_knowledge/CHANGELOG.md latest.json notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
