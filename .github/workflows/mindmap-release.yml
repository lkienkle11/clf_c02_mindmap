# Builds, signs and publishes the production channel when a v* tag is pushed.
# See easy_mindmap_knowledge/docs/RELEASING.md.
name: mindmap-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mindmap-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: easy_mindmap_knowledge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the release
        run: node scripts/release/check-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  build:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            bundles: nsis
            args: ''
            rust_targets: ''
          - os: ubuntu-latest
            bundles: deb
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: easy_mindmap_knowledge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easy_mindmap_knowledge/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: easy_mindmap_knowledge/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - run: npm ci
      - run: npm test
      - run: npm run check

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_CHANNEL: production
          VITE_APP_CHANNEL: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: easy_mindmap_knowledge
          tagName: ${{ github.ref_name }}
          releaseName: AWS CLF-C02 Mindmap ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.production.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.args }}

  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Add asset sizes to latest.json
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --clobber
          node easy_mindmap_knowledge/scripts/release/assert-platforms.mjs latest.json
          gh release view "$GITHUB_REF_NAME" --json assets --jq .assets > assets.json
          node easy_mindmap_knowledge/scripts/release/add-sizes.mjs latest.json assets.json
          node easy_mindmap_knowledge/scripts/release/changelog.mjs "${GITHUB_REF_NAME#v}" easy_mindmap_knowledge/CHANGELOG.md latest.json notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
